# main に送られたら、app/ の中身だけを GitHub Pages に公開する
name: Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 荷物を作るジョブと公開するジョブを分ける（1つのジョブで続けると、上げた直後の荷物が見つからず
# 「No artifacts named "github-pages"」で落ちることがある。2026-11-24・11-25 に2回続けて落ちた。actions/deploy-pages の issue 451）
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
